name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Windows x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Linux headers SDL3 builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libibus-1.0-dev libdbus-1-dev libudev-dev

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Always the pinned SDL3 and Catch2 (cmake/dependencies.cmake), never a package
      # the runner happens to have installed.
      - name: Configure (Debug, sanitizers)
        run: cmake --preset dev -DFETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev
